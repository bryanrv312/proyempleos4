	<!-- HERO -->
	<section class="hero-section">
		<div class="container">

			<div class="row align-items-center">

				<div class="col-lg-7">
					<h1 class="hero-title">
						Encuentra el trabajo de tus sueños
					</h1>

					<p class="hero-subtitle">
						Miles de oportunidades laborales te esperan.
						Busca por categoría, descripción o empresa.
					</p>

					<div class="search-box">

						<form class="row"
							  th:action="@{/search}"
							  method="get"
							  th:object="${search}">

							<div class="col-md-5 mb-3">
								<input type="text"
									   class="form-control"
									   th:field="*{descripcion}"
									   placeholder="Buscar empleo...">
							</div>

							<div class="col-md-4 mb-3">
								<select class="custom-select"
										th:field="*{categoria.id}">

									<option th:value="${null}" selected>
										Categorías
									</option>

									<option th:each="cate : ${categoriasLista}"
											th:value="${cate.id}"
											th:text="${cate.nombre}">
									</option>

								</select>
							</div>

							<div class="col-md-3 mb-3">
								<button type="submit"
										class="btn btn-primary btn-block btn-search">
									Buscar
								</button>
							</div>

						</form>

					</div>
				</div>

			</div>

		</div>
	</section>

	<section class="jobs-section py-5">

		<div class="container">

			<!-- TITULO -->
			<div class="text-center mb-5">

				<h2 class="display-5 fw-bold text-dark">
					Empleos Destacados
				</h2>

				<p class="text-muted fs-5">
					Descubre oportunidades laborales seleccionadas para ti
				</p>

			</div>

			<!-- ALERTAS -->

			<div th:if="${msg != null}"
				 class="alert alert-success shadow-sm"
				 th:text="${msg}">
			</div>

			<div th:if="${error != null}"
				 class="alert alert-warning shadow-sm"
				 th:text="${error}">
			</div>

			<!-- CARDS -->

			<div class="row g-4">

				<div th:each="vacante : ${vacantesLista}"
					 class="col-lg-4 col-md-6">

					<div class="card border-0 shadow-lg h-100 rounded-4 overflow-hidden job-card-modern">

						<!-- IMAGEN -->
						<div class="position-relative">

							<img class="card-img-top job-image-modern"
								 th:src="${vacante.imagen}"
								 alt="Vacante">

							<!-- BADGE -->
							<span class="badge bg-primary position-absolute top-0 end-0 m-3 px-3 py-2 rounded-pill">
							Destacado
						</span>

						</div>

						<div class="card-body p-4 d-flex flex-column">

							<!-- CATEGORIA -->
							<div class="mb-3">

							<span class="badge bg-light text-primary border px-3 py-2 rounded-pill fw-semibold">

								<i class="bi bi-briefcase-fill me-1"></i>

								<span th:text="${vacante.categoria.nombre}"></span>

							</span>

							</div>

							<!-- TITULO -->
							<h4 class="fw-bold text-dark mb-3"
								th:text="${vacante.nombre}">
							</h4>

							<!-- INFO -->
							<div class="text-muted small mb-3">

								<div class="mb-2">

									<i class="bi bi-calendar-event me-2 text-primary"></i>

									<span th:text="${vacante.fecha}"></span>

								</div>

								<div>

									<i class="bi bi-cash-stack me-2 text-success"></i>

									S/ <span th:text="${vacante.salario}"></span>

								</div>

							</div>

							<!-- DESCRIPCION -->
							<p class="text-secondary flex-grow-1"
							   th:text="${vacante.descripcion}">
							</p>

							<!-- BOTON -->
							<a class="btn btn-primary rounded-pill px-4 py-2 mt-3 fw-semibold shadow-sm"
							   th:href="@{/vacantes/view/{id}(id=${vacante.id})}">

								Ver Detalles

								<i class="bi bi-arrow-right ms-2"></i>

							</a>

						</div>

					</div>

				</div>

			</div>

		</div>

	</section>
