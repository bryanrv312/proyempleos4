<nav th:fragment="menu-principal"
	 class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">

	<div class="container">

		<!-- LOGO -->

		<a class="navbar-brand brand-logo" th:href="@{/}">
			EmpleossApp
		</a>

		<!-- MOBILE BUTTON -->

		<button class="navbar-toggler"
				type="button"
				data-toggle="collapse"
				data-target="#navbarMain"
				aria-controls="navbarMain"
				aria-expanded="false"
				aria-label="Toggle navigation">

			<span class="navbar-toggler-icon"></span>

		</button>

		<!-- NAVBAR -->

		<div class="collapse navbar-collapse" id="navbarMain">

			<!-- LEFT MENU -->

			<ul class="navbar-nav mx-auto">

				<li class="nav-item"
					sec:authorize="hasAnyAuthority('SUPERVISOR','ADMINISTRADOR')">

					<a class="nav-link custom-link"
					   th:href="@{/vacantes/indexPaginate}">

						Vacantes

					</a>

				</li>

				<li class="nav-item"
					sec:authorize="hasAnyAuthority('SUPERVISOR','ADMINISTRADOR')">

					<a class="nav-link custom-link"
					   th:href="@{/categorias/indexPaginate}">

						Categorías

					</a>

				</li>

				<li class="nav-item"
					sec:authorize="hasAnyAuthority('ADMINISTRADOR')">

					<a class="nav-link custom-link"
					   th:href="@{/usuarios/indexPaginate}">

						Usuarios

					</a>

				</li>

				<li class="nav-item"
					sec:authorize="hasAnyAuthority('SUPERVISOR','ADMINISTRADOR')">

					<a class="nav-link custom-link"
					   th:href="@{/solicitudes/indexPaginate}">

						Solicitudes

					</a>

				</li>

				<li class="nav-item"
					sec:authorize="hasAnyAuthority('USUARIO')">

					<a class="nav-link custom-link"
					   th:href="@{/solicitudes/indexPaginate_usuario}">

						Mis Solicitudes

					</a>

				</li>

				<li class="nav-item"
					sec:authorize="hasAnyAuthority('USUARIO', 'ADMINISTRADOR', 'SUPERVISOR')">

					<a class="nav-link custom-link"
					   th:href="@{/usuarios/formSetting}">

						Mi Cuenta

					</a>

				</li>

			</ul>

			<!-- RIGHT SIDE -->

			<!-- GUEST -->

			<div sec:authorize="isAnonymous()" class="d-flex align-items-center">

				<a class="btn btn-login mr-2"
				   th:href="@{/index}">

					Ingresar

				</a>

				<a class="btn btn-register"
				   th:href="@{/signup}">

					Registrarse

				</a>

			</div>

			<!-- AUTH USER -->

			<div sec:authorize="isAuthenticated()"
				 class="d-flex align-items-center user-box">

				<div class="user-info mr-3">

                    <span class="welcome-text">
                        Bienvenido
                    </span>

					<span class="user-name"
						  sec:authentication="name">
                    </span>

				</div>

				<a class="btn btn-logout"
				   th:href="@{/logout}">

					Salir

				</a>

			</div>

		</div>

	</div>

</nav>
