<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>EmpleosApp | Ingresar</title>
  <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/bootstrap/icons/bootstrap-icons.css}" rel="stylesheet">
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>

<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-light">

  <div class="card border-0 shadow-lg rounded-5 overflow-hidden" style="max-width: 1000px; width: 100%;">

    <div class="row g-0">

      <!-- LEFT SIDE -->
      <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center text-white p-5"
           style="background: linear-gradient(135deg, #0d6efd, #20c997);">
        <div class="text-center">
          <i class="bi bi-stars mb-4" style="font-size: 5rem;"></i>
          <h1>
            <a class="fw-bold mb-3" th:href="@{/}">
              EmpleossApp
            </a>
          </h1>
          <p class="opacity-75 fs-5">
            Tu futuro profesional comienza aquí.
            Conéctate con oportunidades de nivel mundial.
          </p>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="col-lg-6 bg-white p-5 d-flex flex-column justify-content-center">

        <!-- HEADER -->
        <div class="text-center mb-5">
          <div class="bg-primary bg-opacity-10 d-inline-flex justify-content-center align-items-center rounded-circle mb-3"
               style="width: 95px; height: 95px;">
            <i class="bi bi-person-fill text-primary" style="font-size: 3rem;"></i>
          </div>
          <h2 class="fw-bold text-dark mb-2">Bienvenido</h2>
          <p class="text-muted">Accede a tu cuenta para continuar</p>
        </div>

        <!-- FORM -->
        <form th:action="@{/login}" method="post">
          <!-- USUARIO -->
          <div class="mb-4">
            <label for="username" class="form-label fw-semibold text-dark">Usuario</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-0">
                <i class="bi bi-person-fill text-primary"></i>
              </span>
              <input type="text" class="form-control border-0 bg-light shadow-none"
                     id="username" name="username"
                     placeholder="tu_usuario" required autofocus>
            </div>
          </div>

          <!-- PASSWORD -->
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold text-dark">Contraseña</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-0">
                <i class="bi bi-lock-fill text-primary"></i>
              </span>
              <input type="password" class="form-control border-0 bg-light shadow-none"
                     id="password" name="password"
                     placeholder="••••••••" required>
            </div>
          </div>

          <!-- OPTIONS -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label text-muted" for="remember">Recordarme</label>
            </div>
            <a th:href="@{/forgot-password}" class="text-decoration-none fw-semibold">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- BUTTON -->
          <div class="d-grid mb-4">
            <button type="submit"
                    class="btn btn-primary btn-lg rounded-pill py-3 fw-semibold shadow-sm">
              <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
            </button>
          </div>

          <!-- FOOTER -->
          <div class="text-center">
            <span class="text-muted">¿No tienes cuenta?</span>
            <a th:href="@{/signup}" class="fw-semibold text-decoration-none ms-1">Regístrate</a>
          </div>
        </form>

        <!-- Mensajes de error -->
        <div th:if="${param.error}" class="alert alert-danger rounded-3 shadow-sm mt-3 text-center fw-semibold">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> Credenciales incorrectas
        </div>
        <div th:if="${param.blocked}" class="alert alert-warning rounded-3 shadow-sm mt-3 text-center fw-semibold">
          <i class="bi bi-lock-fill me-2"></i> Su cuenta está bloqueada
        </div>
        <div th:if="${param.confirmado}" class="alert alert-info rounded-3 shadow-sm mt-3 text-center fw-semibold">
          <i class="bi bi-envelope-fill me-2"></i> Confirme su correo electrónico
        </div>

      </div>
    </div>
  </div>
</div>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
